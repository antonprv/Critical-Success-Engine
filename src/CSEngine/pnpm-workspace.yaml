# The engine and its modules: one install, shared dependencies.
packages:
  - Core
  - Modules/Engine/*
  - Modules/Editor/*
  - Modules/Common/*
  - Modules/Scripting
  - Programs/*
  - Tools/*
allowBuilds:
  '@parcel/watcher': true
  electron-winstaller: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - vite@8.3.2
nodeLinker: hoisted
packageImportMethod: copy
