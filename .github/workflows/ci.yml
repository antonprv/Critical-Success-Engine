name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest

    # The web project lives in src/CSEngine/Core, not at the repo root. Applies to
    # `run:` steps only - `uses:` steps below still take repo-relative paths.
    defaults:
      run:
        working-directory: src/CSEngine/Core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 9 rejects pnpm-workspace.yaml when it has settings but no `packages`
      # field ("packages field missing or empty"), which is what this repo has.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # vite 8 / eslint 10 need Node >= 20.19; webpack-dev-server 6 wants >= 22.15.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: src/CSEngine/Core/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build (production)
        run: pnpm build

      # webpack writes to ../Binaries/Core (see webpack.config.js), not dist/.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-build
          path: src/CSEngine/Binaries/Core/

  build-physics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Bridge.csproj targets browser-wasm - both this and the publish step
      # below fail with a missing-workload error without this, even though
      # nothing here is Bridge-specific yet.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # Builds every C# project in the solution (FastMath, Bridge, BepuPhysics,
      # BepuUtilities, Integration) - this is the part CI was skipping
      # entirely before. Fails fast on a plain compile error before the
      # slower AOT publish step below even starts.
      - name: Build solution
        run: dotnet build src/CSEngine/CSEngine.slnx -c Release

      # The actual wasm publish devops/build-physics.sh does - relative
      # paths inside that script ("../src/...") are resolved against this
      # working directory, which is why it has to run from here.
      - name: Publish physics (wasm)
        working-directory: devops
        run: bash build-physics.sh

      # Uploaded unconditionally (always(), even if the step above failed)
      # so a build failure is actually diagnosable from the Actions run
      # instead of just showing a red X.
      - name: Upload dotnet publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-publish-log
          path: devops/publish.log
          if-no-files-found: warn

      - name: Upload physics build output
        uses: actions/upload-artifact@v4
        with:
          name: physics-build
          path: src/CSEngine/Binaries/Physics/
