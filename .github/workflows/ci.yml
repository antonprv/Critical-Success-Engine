name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Bridge.csproj targets browser-wasm - both this and the publish step
      # below fail with a missing-workload error without this.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # Not `dotnet build` on CSEngine.slnx - that solution also lists
      # Core.esproj (the web project), whose own MSBuild target shells out to
      # `pnpm build`. pnpm isn't on PATH yet at this point in the job, so that
      # would fail with "pnpm: not found". FastMath has no project references
      # in either direction, so it's the one C# project the publish step below
      # won't touch - build it explicitly to still cover it.
      - name: Build FastMath
        run: dotnet build src/CSEngine/Modules/Common/Math/FastMath.csproj -c Release

      # The C# style is the TypeScript one (src/CSEngine/.editorconfig): the build reports it, and the files must already
      # be formatted. Then the physics stack's own tests (FastMath, CSPhysics, Integration) on the desktop runtime.
      - name: "C#: style check, physics, DI, DataStream and scripting tests"
        working-directory: src/CSEngine/Modules
        run: |
          for project in Common/Math/FastMath.csproj Common/DI/DotNet/DI.csproj Common/DI/DotNet.Tests/DI.Tests.csproj \
                         Physics/CSPhysics.Utilities/CSPhysics.Utilities.csproj \
                         Physics/CSPhysics/CSPhysics.csproj Physics/Integration/Integration.csproj \
                         Physics/Bridge/Bridge.csproj Physics/Tests/Physics.Tests.csproj \
                         Common/DataStream/DotNet/DataStream.csproj Common/DataStream/DotNet.Tests/DataStream.Tests.csproj \
                         Scripting/CSharp/CSEngine.Scripting.csproj Scripting/CSharp.Tests/CSEngine.Scripting.Tests.csproj \
                         Scripting/Tests/TestGame/TestGame.csproj; do
            dotnet format whitespace "$project" --verify-no-changes
            dotnet format style "$project" --verify-no-changes --severity warn
          done
          # the templates' C# scripts follow the same style (their .editorconfig is the engine's, see Projects.ts)
          for project in ../../Templates/*/TemplateProject.csproj; do
            dotnet format whitespace "$project" --verify-no-changes
            dotnet format style "$project" --verify-no-changes --severity warn
          done
          dotnet test Physics/Tests/Physics.Tests.csproj -c Release
          # the same tests on the fallback for hosts without WebAssembly SIMD (FastMath lanes)
          dotnet test Physics/Tests/Physics.Tests.csproj -c Release -p:CseNoSimd=true
          # DI for C# ([Inject], installers, containers; the C# side of DI across languages)
          dotnet test Common/DI/DotNet.Tests/DI.Tests.csproj -c Release
          # DataStream and MessagePack for C# (the same MessagePack vectors as the TypeScript tests)
          dotnet test Common/DataStream/DotNet.Tests/DataStream.Tests.csproj -c Release
          # C# scripting: the host the TypeScript runtime drives, and the templates' C# components
          dotnet test Scripting/CSharp.Tests/CSEngine.Scripting.Tests.csproj -c Release
          # the C# game the TypeScript scripting tests load in Node (Modules/Scripting/Tests/Integration.test.ts)
          dotnet build Scripting/Tests/TestGame/TestGame.csproj

      # CSPhysics.Utilities, CSPhysics and Integration are project references of
      # Bridge, so this one step already builds and AOT-publishes all four -
      # and leaves .../AppBundle/_framework on disk, which is where the Vite
      # build (BuildTools/PhysicsWasmPlugin.ts) copies the physics runtime from.
      # Relative paths inside the script ("../src/...") are resolved against
      # this working directory.
      # Both runtimes: the main one (WebAssembly SIMD) and the fallback for
      # hosts without SIMD (Binaries/PhysicsNoSimd, served as physics-wasm-nosimd).
      - name: Publish physics (wasm)
        working-directory: devops
        run: bash build-physics.sh

      # Uploaded unconditionally (always(), even if the step above failed)
      # so a build failure is actually diagnosable from the Actions run
      # instead of just showing a red X.
      - name: Upload dotnet publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-publish-log
          path: devops/publish.log
          if-no-files-found: warn

      # pnpm 9 rejects pnpm-workspace.yaml when it has settings but no `packages`
      # field ("packages field missing or empty"), which is what this repo has.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # package.json "engines": vite 8 needs Node >= 20.19, vitest 5 / jsdom 30 >= 22.12.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: src/CSEngine/pnpm-lock.yaml

      # One pnpm workspace for the engine (Core) and its modules (Modules/*).
      - name: Install dependencies
        working-directory: src/CSEngine
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: src/CSEngine/Core
        run: pnpm typecheck

      - name: Lint
        working-directory: src/CSEngine/Core
        run: pnpm lint

      # Vitest with coverage; vitest.config.ts makes the run fail if any file
      # drops below 100% on lines, statements, branches or functions.
      - name: Unit tests (100% coverage enforced)
        working-directory: src/CSEngine/Core
        run: pnpm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: src/CSEngine/Core/coverage/
          if-no-files-found: warn

      # Vite build. PhysicsWasmPlugin copies the _framework folder the publish
      # step produced into Binaries/Core/physics-wasm/_framework - the same
      # place the old webpack build put it.
      - name: Build (production)
        working-directory: src/CSEngine/Core
        run: pnpm build

      - name: Install Playwright browser
        working-directory: src/CSEngine/Core
        run: pnpm exec playwright install --with-deps chromium

      # Real-browser tests that play the built site like a user does (menu,
      # keyboard, mouse, scenes, pixels on screen). E2E_REAL_PHYSICS=1 adds a
      # run against the real CSPhysics wasm runtime published above; the rest use
      # the stand-in runtime from E2E/fixtures so they don't depend on it.
      - name: End-to-end tests
        working-directory: src/CSEngine/Core
        env:
          E2E_REAL_PHYSICS: "1"
        run: pnpm test:e2e

      # Every template is a project of its own: the engine must build each one (Games Sample above builds them together).
      - name: Build every template as a standalone project
        working-directory: src/CSEngine/Core
        run: |
          for template in ../../Templates/*/; do
            # programs (Kind Program: no engine) are built by @cse/program, below
            if [ -f "$template/Template.json" ] && ! grep -q '"Kind": "Program"' "$template/Template.json"; then CSE_PROJECT="$template" pnpm build; fi
          done
          pnpm build

      # Programs without the engine (S6-14): the runtime's checks, the Program template type-checked against it, and
      # the template built as a program (its page, its Electron main and preload).
      - name: "Program module: type check, lint, unit tests (100% coverage), the Program template built"
        working-directory: src/CSEngine/Modules/Engine/Program
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          export CSE_PROJECT="$PWD/../../../../Templates/Program/TemplateProject.cseproject" CSE_OUT_DIR="$RUNNER_TEMP/program" CSE_CONFIGURATION=Prod
          pnpm exec vite build --configLoader runner --config Build/vite.program.config.ts
          pnpm exec vite build --configLoader runner --config Build/vite.program.config.ts --mode main
          pnpm exec vite build --configLoader runner --config Build/vite.program.config.ts --mode preload
          test -f "$CSE_OUT_DIR/index.html" && test -f "$CSE_OUT_DIR/main.cjs" && test -f "$CSE_OUT_DIR/preload.cjs"
          # no engine in a program: nothing of Babylon or the engine's workers in its page
          ! grep -rliE "babylon|GameLogicWorker|PhysicsWorld" "$CSE_OUT_DIR/assets"

      # FastMath for TypeScript: the math the engine's TypeScript runs on.
      - name: "FastMath (TypeScript): type check, lint, unit tests (100% coverage)"
        working-directory: src/CSEngine/Modules/Common/FastMath
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: "Task: type check, lint, unit tests (100% coverage)"
        working-directory: src/CSEngine/Modules/Common/Task
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: "DI: type check, lint, unit tests (100% coverage)"
        working-directory: src/CSEngine/Modules/Common/DI
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: "DataStream (TypeScript): type check, lint, unit tests (100% coverage)"
        working-directory: src/CSEngine/Modules/Common/DataStream
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      # C# scripting, the TypeScript side; its integration tests run C# components on the real .NET runtime.
      - name: "Scripting (TypeScript): type check, lint, unit and integration tests (100% coverage)"
        working-directory: src/CSEngine/Modules/Scripting
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      # The engine's UI module (toolkit, UI document runtime, gallery).
      - name: "UI module: type check, lint, unit tests (100% coverage), build, end-to-end"
        working-directory: src/CSEngine/Modules/Engine/UI
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm test:e2e

      # The SDF world module (edit list, bricks, mesh tier, Babylon layers); its end-to-end test checks that meshes
      # and the SDF surface sort by depth on the demo page.
      - name: "SDF module: type check, lint, unit tests (100% coverage), build, end-to-end"
        working-directory: src/CSEngine/Modules/Engine/SDF
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm test:e2e

      # The desktop shell helpers (S6-07): one instance, files to open, file types, a log file.
      - name: "Desktop shell module: type check, lint, unit tests (100% coverage)"
        working-directory: src/CSEngine/Modules/Common/DesktopShell
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      # CSTables (S6-01): the .cstables format, the checks, the generated code, the runtime.
      - name: "CSTables module: type check, lint, unit tests (100% coverage)"
        working-directory: src/CSEngine/Modules/Common/CSTables
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      # Solution Explorer's model (S6-20): the tree of both modes, .uisolution, the operations, the real disk.
      - name: "Solution module: type check, lint, unit tests (100% coverage)"
        working-directory: src/CSEngine/Modules/Editor/Solution
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      # The UI Designer editor module: its own checks, on top of the UI module it builds on.
      - name: "UI Designer: type check, lint, unit tests (100% coverage), build, end-to-end"
        working-directory: src/CSEngine/Modules/Editor/UIDesigner
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm test:e2e

      # The Project Browser editor module (creates and opens projects; its pages are UI documents).
      - name: "Project Browser: type check, lint, unit tests (100% coverage), build"
        working-directory: src/CSEngine/Modules/Editor/ProjectBrowser
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      # The desktop app (Electron): the editor's programs in windows of the operating system. Its end-to-end tests drive
      # the real app; on the runner's screenless Linux, under a virtual screen.
      - name: "Desktop app: type check, lint, unit tests (100% coverage), build, end-to-end"
        working-directory: src/CSEngine/Programs/Desktop
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          xvfb-run -a pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/CSEngine/Core/playwright-report/
            src/CSEngine/Core/test-results/
          if-no-files-found: ignore

      # The one final artifact: Vite's output, which by this point already has
      # physics-wasm/_framework inside it - not the full ~40 MB publish output,
      # just the trimmed subset the browser actually loads.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-build
          path: src/CSEngine/Binaries/Core/
